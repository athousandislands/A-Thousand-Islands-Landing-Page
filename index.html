<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Thousand Islands</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000000; color: #ffffff; }
        .fade-in { animation: fadeIn 2.5s ease-in forwards; opacity: 0; }
        @keyframes fadeIn { to { opacity: 1; } }
        
        /* The slow heartbeat blink */
        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .blink { animation: blink 3s ease-in-out infinite; }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen font-sans">

    <main class="text-center">
        <div class="fade-in">
            <h1 class="text-5xl md:text-8xl font-light tracking-tighter">A Thousand Islands</h1>
        </div>
    </main>

    <footer class="absolute bottom-12 fade-in">
        <p class="text-white text-xs uppercase tracking-[0.4em] blink">Coming soon</p>
    </footer>

</body>
</html>
</html>
