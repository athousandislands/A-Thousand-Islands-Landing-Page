<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Thousand Islands</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* UI Elements */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Logos */
        .logo {
            position: absolute;
            font-weight: 700;
            letter-spacing: -1px;
            white-space: nowrap;
            transition: opacity 1.5s cubic-bezier(0.25, 1, 0.5, 1), transform 1.5s ease;
        }

        #logo-center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            font-size: 5vw;
            opacity: 1;
        }

        @media (max-width: 768px) {
            #logo-center { font-size: 2.5rem; }
        }

        #logo-center.hidden {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.95);
            pointer-events: none;
        }

        #logo-corner {
            top: 40px;
            left: 40px;
            font-size: 1.2rem;
            opacity: 0;
            transform: translateY(-15px);
            pointer-events: none;
        }

        @media (max-width: 768px) {
            #logo-corner { top: 30px; left: 25px; font-size: 1rem; }
        }

        #logo-corner.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Coming Soon Text */
        #coming-soon {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        #coming-soon.pulsing {
            animation: text-pulse 2s infinite ease-in-out;
        }

        @keyframes text-pulse {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        }

        /* Base Button Styles */
        .btn {
            position: absolute;
            padding: 14px 32px;
            border-radius: 999px; 
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 300; /* Lighter font weight */
            letter-spacing: 0.5px;
            cursor: pointer;
            pointer-events: auto;
            outline: none;
            transition: transform 0.3s ease, opacity 1s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* --- Wake Up Button --- */
        #btn-wake {
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.5); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid transparent; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #btn-wake:active {
            transform: translateX(-50%) scale(0.95);
        }

        #btn-wake.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 20px);
        }

        /* Colored Edge */
        #btn-wake::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 999px;
            padding: 1px; 
            background: linear-gradient(90deg, #3b82f6, #ef4444, #f59e0b, #3b82f6);
            background-size: 300% 100%;
            animation: border-flow 3s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Subtle Glow - Activates on Hover/Click */
        #btn-wake::after {
            content: "";
            position: absolute;
            inset: -1px; 
            border-radius: 999px;
            background: linear-gradient(90deg, #3b82f6, #ef4444, #f59e0b, #3b82f6);
            background-size: 300% 100%;
            animation: border-flow 3s linear infinite;
            z-index: -1;
            filter: blur(2px); /* Very tight radius */
            opacity: 0.15; /* Extremely subtle base */
            transition: opacity 0.3s ease, filter 0.3s ease;
            pointer-events: none;
        }

        #btn-wake:hover::after,
        #btn-wake:active::after {
            opacity: 0.6;
            filter: blur(4px);
        }

        /* --- Contact Us Button --- */
        #btn-contact {
            top: 30px;
            right: 30px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
            /* Greyish Glassmorphism */
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 768px) {
            #btn-contact { top: 20px; right: 20px; padding: 12px 24px; font-size: 0.85rem; }
        }

        #btn-contact.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* Dynamic Mouse-Tracking Edge Light */
        #btn-contact::after {
            content: "";
            position: absolute;
            inset: -1px; /* Covers the static border */
            border-radius: 999px;
            padding: 1px;
            background: radial-gradient(
                60px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                rgba(255, 255, 255, 0.8), 
                transparent 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0; /* Hidden by default */
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #btn-contact:hover::after,
        #btn-contact:active::after {
            opacity: 1; /* Shows on interaction */
        }

        /* Animations */
        @keyframes border-flow {
            0% { background-position: 0% 0; }
            100% { background-position: 300% 0; }
        }

        /* 3D Canvas */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            transition: opacity 2.5s ease;
        }

        #canvas-container.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="logo-center" class="logo">A Thousand Islands</div>
        <div id="logo-corner" class="logo">A Thousand Islands</div>
        <div id="coming-soon">Coming Soon</div>
        <button id="btn-wake" class="btn">Wake Up</button>
        <button id="btn-contact" class="btn">Contact us</button>
    </div>

    <div id="canvas-container"></div>

    <!-- Import Three.js -->
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';

        // --- UI Elements & Mouse Tracking ---
        const logoCenter = document.getElementById('logo-center');
        const logoCorner = document.getElementById('logo-corner');
        const comingSoon = document.getElementById('coming-soon');
        const btnWake = document.getElementById('btn-wake');
        const btnContact = document.getElementById('btn-contact');
        const canvasContainer = document.getElementById('canvas-container');
        const buttons = document.querySelectorAll('.btn');

        // Track mouse for dynamic button edge lighting
        buttons.forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                btn.style.setProperty('--mouse-x', `${x}px`);
                btn.style.setProperty('--mouse-y', `${y}px`);
            });
        });

        // --- State ---
        let isActive = false;
        let audioContext, analyser, dataArray;
        let audioStream = null;
        let resetTimeout, finalResetTimeout;

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        canvasContainer.appendChild(renderer.domElement);

        // --- Shader Material ---
        const vertexShader = `
            uniform float uTime;
            uniform float uAudio;
            varying vec3 vPos;

            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            float snoise(vec3 v){ 
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + 1.0 * C.xxx;
                vec3 x2 = x0 - i2 + 2.0 * C.xxx;
                vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
                i = mod(i, 289.0 ); 
                vec4 p = permute( permute( permute( 
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 1.0/7.0;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vPos = position;
                vec3 pos = position;
                vec3 normal = normalize(pos);

                // Reduced frequency for smoother, wider waves (less ridged)
                float noiseFreq = 0.5; 
                
                // Reduced base amplitude so it stays more circular, but still reacts to audio
                float noiseAmp = 0.04 + (uAudio * 0.2); 
                vec3 noisePos = vec3(pos.x * noiseFreq + uTime * 0.2, pos.y * noiseFreq + uTime * 0.3, pos.z * noiseFreq);
                float noise = snoise(noisePos) * noiseAmp;

                // Apply shape distortion
                pos += normal * noise;
                
                // Increased overall size scaling based on bass by another 5% (0.15 -> 0.20)
                pos *= 1.0 + (uAudio * 0.20);

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_Position = projectionMatrix * mvPosition;

                gl_PointSize = 2.0 * (10.0 / -mvPosition.z);
            }
        `;

        const fragmentShader = `
            varying vec3 vPos;

            void main() {
                vec2 coord = gl_PointCoord - vec2(0.5);
                if (length(coord) > 0.5) discard;

                vec3 color = vec3(1.0, 1.0, 1.0);
                float alpha = smoothstep(0.5, 0.1, length(coord));

                gl_FragColor = vec4(color, alpha * 0.8);
            }
        `;

        // --- Random Spherical Distribution ---
        const particleCount = 12000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 1.1; 

            positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i*3+2] = r * Math.cos(phi);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uAudio: { value: 0 }
            },
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const orb = new THREE.Points(geometry, material);
        scene.add(orb);

        // --- Audio Setup ---
        async function setupAudio() {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                
                const source = audioContext.createMediaStreamSource(audioStream);
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            } catch (err) {
                console.log("Microphone access denied. Running idle animation.");
            }
        }

        function stopAudio() {
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
        }

        // --- Interaction Logic ---
        btnWake.addEventListener('click', () => {
            if (isActive) return;
            isActive = true;

            clearTimeout(resetTimeout);
            clearTimeout(finalResetTimeout);
            comingSoon.classList.remove('pulsing');

            // UI Transitions
            logoCenter.classList.add('hidden');
            btnWake.classList.add('hidden');
            canvasContainer.classList.add('active');
            
            // Contact button fades in and stays active permanently
            btnContact.classList.add('active');

            // Fade in corner logo slightly after center fades out
            setTimeout(() => {
                if(isActive) logoCorner.classList.add('active');
            }, 800);

            // Start Audio & Animation
            setupAudio();

            // Set 15 second reset timer
            resetTimeout = setTimeout(triggerEndingSequence, 15000);
        });

        function triggerEndingSequence() {
            // Fade out orb and corner logo (Contact button remains)
            canvasContainer.classList.remove('active');
            logoCorner.classList.remove('active');
            
            // Fade in Center Logo and Coming Soon
            setTimeout(() => {
                logoCenter.classList.remove('hidden');
                comingSoon.classList.add('pulsing');
            }, 1000);

            stopAudio();

            // Let it pulse for 5 seconds, then fully reset
            finalResetTimeout = setTimeout(() => {
                comingSoon.classList.remove('pulsing');
                btnWake.classList.remove('hidden');
                isActive = false;
            }, 6000);
        }

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            material.uniforms.uTime.value = elapsedTime;

            orb.rotation.y = elapsedTime * 0.08;
            orb.rotation.z = elapsedTime * 0.04;

            if (isActive && analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                const bassRange = 20; 
                for (let i = 0; i < bassRange; i++) {
                    sum += dataArray[i];
                }
                let average = sum / bassRange;
                
                let audioValue = average / 255;
                material.uniforms.uAudio.value += (audioValue - material.uniforms.uAudio.value) * 0.1; 
            } else {
                material.uniforms.uAudio.value += (0 - material.uniforms.uAudio.value) * 0.05;
            }

            renderer.render(scene, camera);
        }

        animate();

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
