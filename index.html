<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Thousand Islands</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000000; color: #ffffff; }
        .fade-in { animation: fadeIn 2s ease-in forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1.5s; }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen font-sans">

    <main class="text-center">
        <div class="fade-in">
            <img src="/assets/logo.png" alt="A Thousand Islands" class="w-64 md:w-80 mx-auto mb-8">
        </div>

        <div class="fade-in delay-1">
            <h1 class="text-3xl md:text-5xl font-medium tracking-tight">A Thousand Islands</h1>
        </div>
    </main>

    <footer class="absolute bottom-10 fade-in delay-2">
        <p class="text-gray-500 text-xs uppercase tracking-[0.3em]">Coming soon...</p>
    </footer>

</body>
</html>
