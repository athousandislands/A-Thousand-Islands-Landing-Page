<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Thousand Islands</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000000; color: #ffffff; }
        .fade-in { animation: fadeIn 2s ease-in forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1.5s; }
        @keyframes fadeIn { to { opacity: 1; } }
        
        /* The slow blink animation */
        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .blink { animation: blink 3s ease-in-out infinite; }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen font-sans">

    <main class="text-center">
        <div class="fade-in">
            <img src="/logo.png" alt="A Thousand Islands" class="w-80 md:w-[32rem] mx-auto mb-10">
        </div>

        <div class="fade-in delay-1">
            <h1 class="text-5xl md:text-8xl font-light tracking-tight">A Thousand Islands</h1>
        </div>
    </main>

    <footer class="absolute bottom-12 fade-in delay-2">
        <p class="text-white text-xs uppercase tracking-[0.4em] blink">Coming soon</p>
    </footer>

</body>
</html>
</html>
